$schema: "https://json-schema.org/draft/2020-12/schema"
title: "EGATF Diagnostic Knowledge Pattern"
type: object
additionalProperties: false
required:
  - schema_version
  - kind
  - id
  - title
  - status
  - applies_to
  - summary
  - evidence_requirements
  - challenge_questions
  - confidence_model
  - outputs
properties:
  schema_version:
    type: string
    description: Version of this pattern schema.
  kind:
    type: string
    const: diagnostic_knowledge_pattern
  id:
    type: string
    pattern: "^[a-z0-9][a-z0-9_.-]*$"
  title:
    type: string
  status:
    type: string
    enum: [draft, reviewed, active, deprecated, retired]
  owner:
    type: string
  last_reviewed:
    type: [string, "null"]
    description: ISO date when the pattern was last reviewed.
  applies_to:
    type: object
    required: [product, components]
    additionalProperties: false
    properties:
      product:
        type: string
      components:
        type: array
        items:
          type: string
      versions:
        type: object
        additionalProperties: false
        properties:
          min:
            type: [string, "null"]
          max:
            type: [string, "null"]
          known_affected:
            type: array
            items:
              type: string
          known_fixed:
            type: array
            items:
              type: string
      deployment:
        type: object
        additionalProperties: false
        properties:
          type:
            type: array
            items:
              type: string
          infrastructure:
            type: array
            items:
              type: string
  summary:
    type: object
    required: [one_line, description]
    additionalProperties: false
    properties:
      one_line:
        type: string
      description:
        type: string
  reported_context:
    type: object
    additionalProperties: false
    properties:
      useful_clues:
        type: array
        items:
          type: string
      anchoring_warning:
        type: string
  evidence_requirements:
    type: object
    additionalProperties: false
    properties:
      required:
        type: array
        items:
          $ref: "#/$defs/evidenceRequirement"
      optional:
        type: array
        items:
          $ref: "#/$defs/evidenceRequirement"
  contradicting_evidence:
    type: array
    items:
      type: object
      required: [kind, meaning]
      additionalProperties: false
      properties:
        kind:
          type: string
        meaning:
          type: string
  missing_evidence:
    type: array
    items:
      type: object
      required: [kind, impact]
      additionalProperties: false
      properties:
        kind:
          type: string
        impact:
          type: string
  time_relationships:
    type: array
    items:
      type: object
      required: [subject, relation, object]
      additionalProperties: false
      properties:
        subject:
          type: string
        relation:
          type: string
          enum: [overlaps_or_precedes, must_be_time_compatible_with]
        object:
          type: string
        required:
          type: boolean
  knowledge_sources:
    type: object
    additionalProperties: false
    properties:
      required_validation:
        type: array
        items:
          type: object
          required: [type, requirement]
          additionalProperties: false
          properties:
            type:
              type: string
            requirement:
              type: string
  challenge_questions:
    type: array
    items:
      type: string
  confidence_model:
    description: >
      Rule lists are evaluated in the order reject, low, high, medium; the first
      matching level wins. 'requires' means all listed conditions must hold,
      'allows' lists conditions that do not prevent Medium, and 'if' means any
      listed condition triggers the level.
    type: object
    additionalProperties: false
    properties:
      high:
        type: object
        additionalProperties: false
        properties:
          requires: {type: array, items: {type: string}}
      medium:
        type: object
        additionalProperties: false
        properties:
          allows: {type: array, items: {type: string}}
      low:
        type: object
        additionalProperties: false
        properties:
          if: {type: array, items: {type: string}}
      reject:
        type: object
        additionalProperties: false
        properties:
          if: {type: array, items: {type: string}}
  outputs:
    type: object
    required: [possible_insight, not_allowed_as_conclusion]
    additionalProperties: false
    properties:
      possible_insight:
        type: string
      not_allowed_as_conclusion:
        type: string
$defs:
  evidenceRequirement:
    type: object
    required: [id, kind, evidence_classes, source_role, time_relation]
    additionalProperties: false
    properties:
      id:
        type: string
      kind:
        type: string
      evidence_classes:
        type: array
        minItems: 1
        items:
          type: string
          enum:
            - structured_source_material
            - extracted_evidence
            - derived_evidence
            - correlated_evidence
            - collection_context
            - knowledge_validation
      source_role:
        type: array
        items:
          type: string
      time_relation:
        type: object
        required: [relation]
        additionalProperties: false
        properties:
          relation:
            type: string
            enum:
              - during_impact_window
              - before_or_during_impact_window
              - overlaps_or_precedes
              - collection_time_snapshot
              - collection_time_snapshot_or_impact_window
          ref:
            type: string
            description: Evidence requirement id this relation is relative to (required for overlaps_or_precedes).
      warning:
        type: string
