$schema: "https://json-schema.org/draft/2020-12/schema"
title: "EGATF Semantic Observation Vocabulary"
type: object
required:
  - schema_version
  - kind
  - observation_kinds
properties:
  schema_version:
    type: string
  kind:
    type: string
    const: semantic_observation_vocabulary
  status:
    type: string
  purpose:
    type: string
  observation_kinds:
    type: object
    additionalProperties:
      type: object
      required:
        - description
        - possible_sources
        - evidence_classes
      properties:
        description:
          type: string
        possible_sources:
          type: array
          items:
            type: string
        evidence_classes:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - structured_source_material
              - extracted_evidence
              - derived_evidence
              - correlated_evidence
              - collection_context
              - knowledge_validation
        timing_warning:
          type: string
