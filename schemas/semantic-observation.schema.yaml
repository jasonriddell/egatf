$schema: "https://json-schema.org/draft/2020-12/schema"
title: "EGATF Semantic Observation Vocabulary"
type: object
additionalProperties: false
required:
  - schema_version
  - kind
  - observation_kinds
properties:
  schema_version:
    type: string
  kind:
    type: string
    const: semantic_observation_vocabulary
  status:
    type: string
  purpose:
    type: string
  contract_note:
    type: string
  observation_kinds:
    type: object
    additionalProperties:
      type: object
      required:
        - description
        - possible_sources
        - evidence_classes
      additionalProperties: false
      properties:
        contract:
          type: object
          description: >
            Operational meaning of the observation, so two adapters cannot emit
            the same kind with different semantics. Values marked provisional are illustrative.
          additionalProperties: false
          required: [status, definition, threshold]
          properties:
            status: {type: string, enum: [provisional, validated]}
            definition: {type: string}
            baseline: {type: string}
            threshold: {type: string}
            unit: {type: string}
            minimum_coverage: {type: string}
        description:
          type: string
        possible_sources:
          type: array
          items:
            type: string
        evidence_classes:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - structured_source_material
              - extracted_evidence
              - derived_evidence
              - correlated_evidence
              - collection_context
              - knowledge_validation
        timing_warning:
          type: string
  contradiction_kinds:
    type: object
    additionalProperties:
      type: object
      required: [description, absence_semantics]
      additionalProperties: false
      properties:
        description: {type: string}
        absence_semantics:
          type: string
          description: Coverage required before this can be asserted, or 'not_applicable'.
  missing_evidence_kinds:
    type: object
    additionalProperties:
      type: object
      required: [description]
      additionalProperties: false
      properties:
        description: {type: string}
