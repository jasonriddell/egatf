schema_version: "0.1"
kind: semantic_observation_vocabulary
status: draft

purpose: >
  Stable semantic observation names used by EGATF Diagnostic Knowledge Patterns.
  These names should remain stable even when support bundle formats, log formats,
  or extraction tools change.

observation_kinds:
  client.timeout_increase:
    description: Client-visible timeout rate or timeout frequency increased.
    possible_sources:
      - client_logs
      - ysql_logs
      - ycql_logs
      - application_logs
      - metrics
    evidence_classes:
      - extracted_evidence
      - correlated_evidence

  client.latency_increase:
    description: Client-visible latency increased above baseline or expected range.
    possible_sources:
      - client_logs
      - ysql_logs
      - ycql_logs
      - application_logs
      - metrics
    evidence_classes:
      - extracted_evidence
      - correlated_evidence

  raft.leader_instability:
    description: Raft leadership changed, was unavailable, or was repeatedly contested for relevant tablets or groups.
    possible_sources:
      - master_logs
      - tserver_logs
      - consensus_meta
      - tablet_report
    evidence_classes:
      - extracted_evidence
      - derived_evidence
      - correlated_evidence

  raft.no_leader_observed:
    description: A tablet or raft group was observed without a leader.
    possible_sources:
      - master_logs
      - tserver_logs
      - tablet_report
      - consensus_meta
    evidence_classes:
      - extracted_evidence
      - derived_evidence

  tablet.leaderless:
    description: A tablet is computed or observed to have no current leader.
    possible_sources:
      - tablet_report
      - consensus_meta
      - master_metadata
    evidence_classes:
      - derived_evidence
    timing_warning: >
      Tablet report and consensus metadata may be collection-time snapshots and should
      not automatically be used as evidence for a historical impact window.

  tablet.under_replicated:
    description: A tablet has fewer live or valid replicas than expected for the replication factor.
    possible_sources:
      - tablet_report
      - master_metadata
    evidence_classes:
      - derived_evidence

  tablet.over_replicated:
    description: A tablet has more replicas than expected for the replication factor.
    possible_sources:
      - tablet_report
      - master_metadata
    evidence_classes:
      - derived_evidence

  node.disk_latency_increase:
    description: Disk latency increased on one or more nodes.
    possible_sources:
      - node_metrics
      - prometheus_metrics
      - iostat_output
      - node_exporter
    evidence_classes:
      - extracted_evidence
      - correlated_evidence

  node.cpu_saturation:
    description: CPU usage was saturated or near saturation on one or more nodes.
    possible_sources:
      - node_metrics
      - prometheus_metrics
      - node_exporter
      - top_output
    evidence_classes:
      - extracted_evidence
      - correlated_evidence

  process.restart_observed:
    description: A process restart was observed.
    possible_sources:
      - service_logs
      - system_logs
      - kubernetes_events
      - process_lifecycle_output
    evidence_classes:
      - extracted_evidence

  metrics.coverage_gap:
    description: Metrics expected for an investigation are absent, incomplete, low-resolution, or outside the required time window.
    possible_sources:
      - manifest
      - collection_context
      - prometheus_export
      - metrics_index
    evidence_classes:
      - collection_context
      - derived_evidence

  knowledge.version_mismatch:
    description: A reference knowledge source does not apply cleanly to the collected product version or deployment context.
    possible_sources:
      - documentation_metadata
      - source_code_version
      - release_notes
      - known_issue_database
    evidence_classes:
      - knowledge_validation

contradiction_kinds:
  stable_leadership_during_impact:
    description: Leadership was stable for the relevant tablets throughout the impact window.
    absence_semantics: >
      This is evidence of absence. It may only be asserted when log, metric or
      metadata coverage of the impact window is adequate; otherwise record
      metrics.coverage_gap and treat the result as unknown, not as stable.
  timeout_precedes_leader_instability:
    description: Client timeouts began before any observed leader instability.
    absence_semantics: >
      Requires adequate coverage of the period before the first timeout; absence of
      earlier instability in a window with gaps does not establish this.
  stronger_non_raft_explanation:
    description: Another explanation (disk, CPU, network, client configuration) better accounts for the symptoms.
    absence_semantics: not_applicable

missing_evidence_kinds:
  workload_to_tablet_mapping:
    description: A mapping from the affected workload to the tablets it touches.
  time_aligned_tablet_state:
    description: Tablet state captured for the impact window rather than at collection time.
  version_correct_reference_knowledge:
    description: Documentation or source code validated against the collected product version.
